name: Publicar plugin
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar PHP y comportamiento
        run: |
          set -euo pipefail
          version=$(sed -n 's/ \* Version: //p' creative-pear-translate-ai.php)
          test "$version" = "${GITHUB_REF_NAME#v}"
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          php tests/calendar.php
          node tests/calendar.cjs
          node --check assets/calendar.js
          node --check assets/admin.js
          node --check assets/frontend.js
      - name: Crear ZIP
        run: |
          mkdir -p build/creative-pear-translate-ai
          cp creative-pear-translate-ai.php README.md readme.txt LICENSE build/creative-pear-translate-ai/
          cp -r includes assets build/creative-pear-translate-ai/
          cd build
          zip -r creative-pear-translate-ai.zip creative-pear-translate-ai
          sha256sum creative-pear-translate-ai.zip > creative-pear-translate-ai.zip.sha256
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/creative-pear-translate-ai.zip build/creative-pear-translate-ai.zip.sha256 --title "Creative Pear Translate AI $GITHUB_REF_NAME" --generate-notes
